<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文兔</title>
    <!-- Shared cache-bust stamp: all four window HTML files must carry the
         SAME ?v= value. Bump it in all four together whenever a referenced
         static resource changes: the installed WebView caches these assets
         across versions, so users would otherwise keep the old file.
         Known gap: the entry module script's ES-module static imports
         carry no stamp. -->
    <link rel="stylesheet" href="common.css?v=8">
    <link rel="stylesheet" href="floating.css?v=8">
</head>
<body>
    <div class="indicator" id="indicator"></div>
    <div id="transcript-text" aria-live="polite"></div>

    <script type="module" src="floating.js?v=8"></script>
</body>
</html>
