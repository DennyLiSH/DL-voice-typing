<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粘贴前确认</title>
    <!-- Shared cache-bust stamp: all four window HTML files must carry the
         SAME ?v= value. Bump it in all four together whenever a referenced
         static resource changes: the installed WebView caches these assets
         across versions, so users would otherwise keep the old file.
         Known gap: the entry module script's ES-module static imports
         carry no stamp, so bumping ?v= still does NOT refresh lib/*.js
         (and the other statically imported modules) for existing
         installed users. -->
    <link rel="stylesheet" href="common.css?v=8">
    <link rel="stylesheet" href="review.css?v=8">
</head>
<body>
    <div class="container" id="container">
        <textarea
            id="review-text"
            aria-label="转录结果"
            aria-multiline="true"
            spellcheck="false"
        ></textarea>
        <div class="review-hint" id="review-hint">Enter 确认粘贴 · Shift+Enter 换行 · Esc 取消</div>
        <div class="error-msg" id="error-msg"></div>
        <div class="button-row">
            <button class="btn-cancel" id="btn-cancel" aria-label="取消">取消</button>
            <button class="btn-confirm" id="btn-confirm" aria-label="确认粘贴">确认粘贴</button>
        </div>
    </div>

    <script type="module" src="review.js?v=8"></script>
</body>
</html>
