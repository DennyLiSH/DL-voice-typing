<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录音转录</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="transcribe.css">
</head>
<body>
    <div class="layout">
        <aside class="list-pane">
            <div class="list-header">
                <span class="list-title">录音列表</span>
                <button id="btn-refresh" class="btn-secondary" aria-label="刷新列表">刷新</button>
            </div>
            <div id="list-error" class="error-bar" hidden></div>
            <div id="rec-list" class="rec-list" role="listbox" aria-label="录音列表"></div>
            <div id="list-cap" class="list-cap" hidden>列表仅加载最近 200 条录音</div>
            <div id="rec-empty" class="rec-empty" hidden>暂无录音，按住录音快捷键开始第一条</div>
        </aside>

        <main class="detail-pane">
            <div id="detail-empty" class="detail-empty">从左侧选择一段录音</div>

            <div id="detail" class="detail" hidden>
                <div class="detail-header">
                    <span id="detail-title" class="detail-title"></span>
                    <span id="detail-badges" class="badges"></span>
                </div>

                <div class="player-row">
                    <audio id="audio" controls></audio>
                    <span id="audio-error" class="audio-error-badge" hidden>音频加载失败</span>
                </div>

                <div class="action-row">
                    <button id="btn-transcribe" class="btn-primary">转录</button>
                    <label class="llm-toggle">
                        <input type="checkbox" id="chk-llm"> LLM 纠错
                    </label>
                    <button id="btn-cancel" class="btn-secondary" hidden>取消转录</button>
                </div>

                <div id="progress-wrap" class="progress-wrap" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="转录进度">
                    <div class="progress-track">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="progress-label" class="progress-label"></span>
                </div>

                <div id="segments" class="segments"></div>
                <div id="segments-loading" class="segments-loading" hidden aria-hidden="true">
                    <div class="skel-row"><span class="skel skel-ts"></span><span class="skel skel-text"></span></div>
                    <div class="skel-row"><span class="skel skel-ts"></span><span class="skel skel-text"></span></div>
                    <div class="skel-row"><span class="skel skel-ts"></span><span class="skel skel-text"></span></div>
                </div>
                <div id="segments-empty" class="segments-empty" hidden>转录未产生任何段落</div>

                <div class="merged-row">
                    <div class="merged-label">合并文本</div>
                    <textarea id="merged" readonly rows="3" aria-label="合并文本"></textarea>
                </div>

                <div class="inject-row">
                    <button id="btn-inject" class="btn-primary">粘贴文本</button>
                    <span id="inject-spinner" class="spinner" hidden></span>
                    <span id="inject-target" class="inject-target" hidden></span>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="transcribe.js"></script>
</body>
</html>
